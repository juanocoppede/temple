name: Build unsigned IPA
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project Temple.xcodeproj -scheme Temple -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Temple.app Payload/
          zip -qr Temple.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Temple-ipa, path: Temple.ipa }
